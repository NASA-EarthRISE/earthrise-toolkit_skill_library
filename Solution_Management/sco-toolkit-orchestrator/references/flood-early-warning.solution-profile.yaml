# Example profile built from the toolkit's own flood-evacuation examples (Tools 6 and 12).
# Use it to test the agents: paste into a chat and type `/status` or `/next`.
meta:
  solution_title: "District Flood Early Warning (example)"
  solution_manager: "<<name>>"
  organization: "<<org>>"
  phase: 2
  arl_current: 4
  arl_target: 7
  last_updated: "2026-11-13"
  tools_completed: ["01-designing-for-impact", "06-information-chain-analysis"]

impact:
  need: "District officials lack timely, actionable flood alerts to trigger preparedness measures."
  why_it_matters: "Delayed evacuation increases risk to life."
  problem_statement: "Slow, inaccessible flood alerts delay district preparedness and household evacuation."
  if_then: "If we co-design automated flood alerts with district DRM and local NGOs, then districts activate preparedness 24–72 h before peak flooding, then lives and livelihoods are protected."
  results_framework:
    inputs: ["Co-design sessions with disaster management agencies", "Needs assessment with district DRM"]
    outputs: ["Flood forecast and alert bulletin", "Trained local officials"]
    outcomes_short_term: ["Local officials use updated risk maps in decisions"]
    outcomes_long_term: ["Institutions report faster evacuation and resource mobilization"]
    impact: ["People evacuated before floods; reduced loss of life"]

decision_pathways:
  - id: ICA-1
    decision: "Activate district flood preparedness measures"
    decision_maker: "District Disaster Management Committee"
    timing: "24–72 hours before peak flooding"
    beneficiary: "Households in flood-prone districts"
    products: ["Flood forecast and alert bulletin"]
    consequence_of_failure: "Delayed evacuation increases risk to life"
    links:
      - {id: C1, from: "National Meteorological Org", to: "National DRM", input: "Flood forecast data", interpretation: "Determine national alert level"}
      - {id: C2, from: "National DRM", to: "District DRM", input: "Alert level", interpretation: "Evacuation thresholds met?"}
      - {id: C3, from: "District DRM", to: "Local NGO", input: "Evacuation decision and guidance", interpretation: "Translate into local instructions/channels"}
      - {id: C4, from: "Local NGO", to: "Households", input: "Evacuation instruction", interpretation: "Evacuate or prepare"}
    priority_issues:
