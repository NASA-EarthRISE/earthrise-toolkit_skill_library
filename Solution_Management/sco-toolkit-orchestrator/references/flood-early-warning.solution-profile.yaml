      - {link: C4, type: delivery, action: "Radio announcements targeting elderly households", owner: "Local NGO", phase: pilot}
      - {link: C4, type: engagement, action: "Train community leaders on key messages", owner: "Local NGO", phase: co-design}

assumptions:
