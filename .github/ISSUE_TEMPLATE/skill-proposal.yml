name: Skill proposal
description: Propose a new skill (claim it before you build it)
title: "[skill] <domain>/<skill-id>"
labels: ["skill-proposal"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options: [GIT, Science, Solution_Management]
    validations: {required: true}
  - type: input
    id: id
    attributes: {label: Proposed skill id (kebab-case)}
    validations: {required: true}
  - type: textarea
    id: job
    attributes:
      label: The one job it does, and when someone would use it
    validations: {required: true}
  - type: textarea
    id: io
    attributes:
      label: Inputs → Outputs (artifact types from standards/ARTIFACT_TYPES.md)
      placeholder: "samples.csv, dataset.raster -> metrics.json"
    validations: {required: true}
  - type: textarea
    id: connects
    attributes:
      label: Which skills/teams would chain with it?
  - type: input
    id: owner
    attributes: {label: Owner (GitHub handle)}
    validations: {required: true}
